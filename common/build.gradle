// 用途：:common 只是「两端必须完全一致」的共享源码存放处 —— 自定义数据包协议、数据模型、常量。
//
// 为什么这里不写任何插件、也不写任何依赖：
//   :common 不需要独立编译，也不产出任何产物。它的源码目录由 :server 与 :client 各自通过
//   sourceSets.main.java.srcDir 并入自己的编译（见两个子工程的 build.gradle）。
//   因此它既不需要 Loom，也不需要 Minecraft 依赖，构建图上根本不存在这个节点的产物 ——
//   从机制上杜绝「多出第三个 jar / 第三份 fabric.mod.json」，同时保证两端协议类由同一份源码生成。
