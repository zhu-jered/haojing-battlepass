# 用途：集中锁定技术栈版本。需求文档第 1 节要求版本锁定，禁止自行更换加载器或大版本。

# --- Gradle 自身 ---
org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# 为什么把 JDK 路径留成注释：需求要求 JDK 21，本机同时装有 jdk-17 与 jdk-21.0.12.1，
# 且 PATH 上的 java 已是 21，因此默认靠 PATH 解析即可。
# 若将来 PATH 被改成 17，取消下面一行注释（路径需与本机一致）即可强制使用 21。
# org.gradle.java.home=C:\\Program Files\\Java\\jdk-21.0.12.1

# --- 技术栈锁定（需求文档 §1）---
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.6
loader_version=0.18.1
fabric_api_version=0.140.2+1.21.11

# 为什么 Loom 是 1.14.6：需求锁定 Loom 1.14 大版本，1.14.6 是该大版本内最新补丁。
loom_version=1.14.6

# --- 本模组标识 ---
# 命名说明：「镐京」的「镐」读 hào（破读音），需求文档里写的 gaojing 是拼音笔误，
# 已用户确认统一更正为 haojing，包名与目录名一并更正。
mod_version=0.1.0-SNAPSHOT
maven_group=com.haojing.battlepass
# 两个成品 jar 会在各自子工程里追加 -server / -client 后缀。
archives_base_name=haojing-battlepass

# --- 编译目标 ---
java_version=21

# --- 镜像（本机 Mojang 与 GitHub 域名被 hosts 屏蔽，必须改走 BMCLAPI）---
# 这里是 BMCLAPI 的唯一事实来源：各子工程的 customMinecraftMetadata、settings.gradle 的
# 物料预热逻辑都由它派生。
bmclapi_base=https://bmclapi2.bangbang93.com
#
# 本机自建 Maven 仓库目录名（位于 GRADLE_USER_HOME 下）。用途见根 build.gradle：
# 实测 Maven Central 没有 com.mojang 系列构件，必须本地补齐，再把它当作 Loom 的 "Mojang" 仓库。
local_maven_dir=local-maven
#
# 为什么用 extra property 这种写法：实测 Loom 的 net.fabricmc.loom.util.MirrorUtil 读的是
# ExtensionAware 的 extra properties，而 Gradle 会把 gradle.properties 的条目暴露为 extra
# property，所以由本文件派生的这些值会被 Loom 真正读到（不是注释性的配置）。
#   loom_libraries_base  -> Loom 注册的 "Mojang" Maven 仓库地址（原值 https://libraries.minecraft.net/）
#   loom_resources_base  -> 原版 assets 基址（原值 https://resources.download.minecraft.net/），仅 runClient 需要
